# Render Blueprint: the backend (Docker) and the frontend (static site). Render dashboard: New > Blueprint > pick this repo.
# Secrets are never in this file: every `sync: false` value is typed into the dashboard once. See docs/12_DEPLOYMENT.md.
services:
  - type: web
    name: karyakarta-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # database and files: Supabase
      - key: DATABASE_URL            # Supabase > Connect > "Transaction pooler" connection string (port 6543)
        sync: false
      - key: SUPABASE_URL            # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_KEY    # Supabase > Settings > API > service_role key (server only)
        sync: false
      - key: SUPABASE_BUCKET
        value: karyakarta-files
      # the web app's address (set after the frontend is deployed): CORS and the shop-verification link
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # behaviour
      - key: DEMO_MODE               # recorded Sarvam results are served first
        value: "true"
      - key: N8N_FALLBACK_INPROCESS  # no n8n here: the backend runs the same steps itself
        value: "true"
      - key: CPV_ALLOW_DEMO_REFERENCE
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # partners
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY_NEW_FOR_VOICE
        sync: false
      - key: SARVAM_AGENT_ID
        sync: false
      - key: SARVAM_VCIP_AGENT_ID
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      - key: COGNEE_BASE_URL
        sync: false
      - key: COGNEE_TENANT_ID
        sync: false
      - key: COGNEE_USER_ID
        sync: false
      - key: COGNEE_API_KEY
        sync: false

  - type: web
    name: karyakarta-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL            # the backend's public address, e.g. https://karyakarta-api.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite                # single-page app: /kam, /dashboard/..., /cpv/<token> all load index.html
        source: /*
        destination: /index.html
